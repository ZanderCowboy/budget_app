name: budget_app
description: A budget app to categorize my expenses.

publish_to: "none"

version: 1.0.0+1

environment:
  # sdk: ">=2.17.0-45.0.dev <3.0.0"
  sdk: ">=3.3.0 <4.0.0"
  # sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  auto_route: ^8.1.2
  bloc: ^8.1.4
  build_runner: ^2.4.13
  charts_flutter: ^0.12.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  freezed: ^2.5.2
  freezed_annotation: any
  get_it: ^7.7.0
  global: ^0.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  injectable: ^2.4.1
  intl: ^0.17.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
